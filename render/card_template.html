<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
  <style>
    {{FONT_CSS}}

    :root {
      --bg-canvas: #0D1117;
      --bg-panel: #121926;
      --bg-panel-elevated: #16203260;
      --border-panel: rgba(230, 237, 243, 0.10);
      --border-emerald: rgba(0, 229, 153, 0.38);

      --text-primary: #E6EDF3;
      --text-secondary: #9FB0C3;
      --text-muted: #6B7C8F;

      --emerald: #00E599;
      --violet: #8B5CF6;
      --amber: #F59E0B;
      --emerald-soft: rgba(0, 229, 153, 0.12);

      --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "Geist Mono", ui-monospace, "Cascadia Code", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: var(--bg-canvas);
      font-family: var(--font-sans);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .card {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 288px minmax(0, 1fr) 192px;
      padding: 0 80px;
      background:
        radial-gradient(circle at 82% 8%, rgba(139, 92, 246, 0.16) 0%, transparent 46%),
        radial-gradient(circle at 10% 96%, rgba(0, 229, 153, 0.10) 0%, transparent 44%),
        var(--bg-canvas);
    }

    /* Faint 24px technical grid */
    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(230, 237, 243, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230, 237, 243, 0.035) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    .card > * { position: relative; z-index: 1; }

    /* ---------- Header band (~15%) ---------- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 2px solid var(--border-emerald);
      padding: 40px 0 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .brand-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 18px var(--emerald);
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      white-space: nowrap;
    }

    .brand-handle {
      font-family: var(--font-mono);
      font-size: 22px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-shrink: 0;
    }

    .tag-pill {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: var(--emerald);
      background: var(--emerald-soft);
      border: 1px solid var(--border-emerald);
      border-radius: 999px;
      padding: 10px 24px;
      max-width: 420px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pagination {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
      background: rgba(230, 237, 243, 0.05);
      border: 1px solid var(--border-panel);
      border-radius: 10px;
      padding: 10px 20px;
      white-space: nowrap;
    }

    /* ---------- Hero band (~50%) ---------- */
    .hero {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 36px;
      padding: 52px 0;
      min-height: 0;
    }

    .headline {
      font-size: 78px;
      font-weight: 600;
      line-height: 1.08;
      letter-spacing: -0.035em;
      color: var(--text-primary);
      text-wrap: balance;
      overflow-wrap: anywhere;
    }

    .card-body {
      font-size: 34px;
      font-weight: 400;
      line-height: 1.52;
      color: var(--text-secondary);
      overflow-wrap: anywhere;
    }

    /* Diagram / comparison panel */
    .panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 26px;
      background:
        linear-gradient(135deg, rgba(0, 229, 153, 0.08) 0%, transparent 55%),
        var(--bg-panel);
      border: 1px solid var(--border-panel);
      border-left: 4px solid var(--emerald);
      border-radius: 22px;
      padding: 40px 44px;
      box-shadow: 0 28px 60px -28px rgba(0, 0, 0, 0.75);
      overflow-wrap: anywhere;
    }

    .panel-tag {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--emerald);
    }

    .panel-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 12px var(--emerald);
      flex-shrink: 0;
    }

    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .bullet-item {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: start;
      gap: 16px;
      font-size: 30px;
      line-height: 1.44;
      color: var(--text-primary);
      overflow-wrap: anywhere;
    }

    .bullet-icon-svg {
      margin-top: 8px;
      color: var(--emerald);
      flex-shrink: 0;
    }

    /* ---------- Footer band (~10%) ---------- */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-top: 1px solid var(--border-panel);
      padding: 28px 0 40px;
    }

    .footer-source {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    .source-domain {
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 600;
      color: var(--emerald);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-timestamp {
      font-family: var(--font-mono);
      font-size: 20px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-label {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      border: 1px solid var(--border-panel);
      border-radius: 8px;
      padding: 10px 18px;
      white-space: nowrap;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <header class="header">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">OmniPost</span>
        <span class="brand-handle">{{AUTHOR}}</span>
      </div>
      <div class="header-meta">
        <span class="tag-pill">{{TAG}}</span>
        <span class="pagination">{{COUNTER}}</span>
      </div>
    </header>

    <main class="hero">
      <h1 class="headline">{{HEADLINE}}</h1>
      {{BODY_HTML}}
      {{PANEL_HTML}}
    </main>

    <footer class="footer">
      <div class="footer-source">
        <span class="source-domain">{{SOURCE}}</span>
        <span class="source-timestamp">{{TIMESTAMP}}</span>
      </div>
      <span class="page-label">{{PAGE_LABEL}}</span>
    </footer>
  </div>
</body>
</html>
