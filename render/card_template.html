<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #080A0F;
      --bg-card: #0F131D;
      --bg-card-elevated: #151A27;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-card-highlight: rgba(0, 229, 153, 0.35);

      --text-primary: #FFFFFF;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --accent-primary: #00E599;
      --accent-muted: rgba(0, 229, 153, 0.12);
      --accent-gradient: linear-gradient(135deg, #00E599 0%, #00B4D8 100%);

      --font-sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "Geist Mono", monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      background-color: var(--bg-canvas);
      font-family: var(--font-sans);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 1080px;
      height: 1080px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 80px;
      background: radial-gradient(circle at 85% 15%, #10192A 0%, var(--bg-canvas) 75%);
      border: 1px solid var(--border-card);
      overflow: hidden;
    }

    /* Subtle ambient technical grid texture */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 1;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .badge {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-primary);
      background: var(--accent-muted);
      border: 1px solid var(--border-card-highlight);
      padding: 6px 18px;
      border-radius: 999px;
    }

    .author-badge {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .slide-counter {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      font-family: var(--font-mono);
    }

    .content-container {
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 28px 0;
    }

    /* Wide H1 heading: max 2 lines rule */
    .card-title {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: -0.03em;
      color: #FFFFFF;
      margin-bottom: 24px;
      max-width: 920px;
    }

    .card-body {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 28px;
      max-width: 900px;
    }

    /* Bento panel container */
    .panel {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 18px;
      padding: 36px 44px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel-highlight {
      border-color: var(--border-card-highlight);
      background: radial-gradient(circle at 10% 20%, #162032 0%, var(--bg-card) 90%);
    }

    .panel-tag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-primary);
      font-family: var(--font-mono);
    }

    .panel-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary);
    }

    .bullets {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .bullet-item {
      font-size: 22px;
      line-height: 1.5;
      color: var(--text-primary);
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .bullet-icon-svg {
      flex-shrink: 0;
      margin-top: 4px;
      color: var(--accent-primary);
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 10;
    }

    .footer-brand {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
    }

    .footer-pill {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-primary);
      background: var(--accent-muted);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-card-highlight);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="badge-group">
        <span class="badge">{{TAG}}</span>
        <span class="author-badge">{{AUTHOR}}</span>
      </div>
      <span class="slide-counter">{{COUNTER}}</span>
    </div>

    <div class="content-container">
      <h1 class="card-title">{{HEADLINE}}</h1>
      {{BODY_HTML}}
      
      {{PANEL_HTML}}
    </div>

    <div class="footer">
      <div class="footer-brand">
        <span>OmniPost Engine</span>
        <span>•</span>
        <span>Verified Systems Design</span>
      </div>
      <div class="footer-pill">Production Architecture</div>
    </div>
  </div>
</body>
</html>
