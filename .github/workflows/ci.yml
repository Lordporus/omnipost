name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      CI: "true"
      HEADLESS: "1"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      DISCORD_WEBHOOK_URL: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Setup test configuration
        run: |
          python -c "import shutil, pathlib; p = pathlib.Path('config.json'); p.exists() or shutil.copy('config.example.json', p)"

      - name: Verify CLI Entrypoint
        run: |
          python omnipost.py --help
          python -m omnipost --help
          python -m omnipost doctor --no-live

      - name: Run test suite
        run: pytest -v

      - name: Run contract, privacy, and golden tests
        run: |
          pytest tests/test_selector_contracts.py tests/test_artifact_privacy.py tests/test_storybook_render.py tests/test_carousel_rendering.py -q
