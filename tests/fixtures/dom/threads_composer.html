<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Threads composer fixture</title></head>
<body>
  <nav>
    <a href="/@operator">Profile</a>
    <div role="button" aria-label="Like"><svg aria-label="Like"></svg></div>
  </nav>

  <main>
    <div role="button" aria-label="Create new thread">
      <svg aria-label="Create"></svg>
      <span>New thread</span>
    </div>

    <div role="dialog">
      <div contenteditable="true" role="textbox" data-lexical-editor="true"></div>
      <input type="file" accept="image/png,image/jpeg" />
      <div role="button">Post</div>
    </div>

    <div role="alert">
      <a href="/@operator/post/abc123">View post</a>
    </div>
  </main>
</body>
</html>
